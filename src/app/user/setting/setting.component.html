<section class="settings">
  <div class="container">
    <div class="header">
      <h2>Account Settings</h2>
      <p> Update your personal information </p>
    </div> @if (isLoading) { <div class="loading"> Loading... </div> } @else { <form [formGroup]="settingForm"
      (ngSubmit)="updateUserData()" class="settings-form">
      <div class="grid"> <!-- First Name -->
        <div class="field"> <label>First Name</label> <input type="text" formControlName="firstName"
            placeholder="First name">
            @if ( settingForm.controls.firstName.touched &&
          settingForm.controls.firstName.invalid ) { <small> First name is required </small> } </div> <!-- Last Name -->
        <div class="field"> <label>Last Name</label> <input type="text" formControlName="lastName"
            placeholder="Last name"> </div> <!-- Email -->
        <div class="field full"> <label>Email</label> <input type="email" formControlName="email"> <small> Email cannot
            be changed from here </small> </div> <!-- Phone -->
        <div class="field full"> <label>Phone</label> <input type="tel" formControlName="phone"
            placeholder="Phone number"> </div> <!-- Address -->
        <div class="field"> <label>Address</label> <input type="text" formControlName="address" placeholder="Address">
        </div> <!-- City -->
        <div class="field"> <label>City</label> <input type="text" formControlName="city" placeholder="City"> </div>
        <!-- Country -->
        <div class="field"> <label>Country</label> <input type="text" formControlName="Country" placeholder="Country">
        </div>
      </div>
      <div class="actions"> <button type="submit" class="btn" [disabled]="isSaving"> @if (isSaving) { Saving... } @else
          { Save Changes } </button> </div>
    </form> }
  </div>
</section>
